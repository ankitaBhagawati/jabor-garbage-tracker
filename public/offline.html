<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006C49" />
    <title>Jabor Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #E8F0E9;
        color: #161D19;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 8px;
        color: #006C49;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #3C4A42;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="Jabor" />
      <h1>You are offline</h1>
      <p>Reconnect to load live reports or submit a garbage report with photo proof.</p>
    </main>
  </body>
</html>
